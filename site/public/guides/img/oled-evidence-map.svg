<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 872" width="1400" height="872" role="img" aria-label="Evidence from MSI firmware, related Samsung source and a camera trace, with the limits of each.">
<rect x="0" y="0" width="1400" height="872" fill="#09090b"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<text x="64" y="72" font-size="38" font-weight="500" fill="#f4efe7">Three sources, with different limits</text>
<text x="64" y="114" font-size="23" font-weight="400" fill="#a7a29a">What each part of the investigation can establish.</text>
<line x1="64" y1="148" x2="1336" y2="148" stroke="#343238" stroke-width="1"/>
<text x="64" y="202" font-size="24" font-weight="500" fill="#a7a29a">Evidence</text>
<text x="454" y="202" font-size="24" font-weight="500" fill="#a7a29a">What it establishes</text>
<text x="966" y="202" font-size="24" font-weight="500" fill="#a7a29a">Where it stops</text>
<line x1="64" y1="226" x2="1336" y2="226" stroke="#343238" stroke-width="1"/>
<text x="64" y="270" font-size="22" font-weight="500" fill="#f4efe7">Exact target</text>
<text x="64" y="314" font-size="30" font-weight="500" fill="#f4efe7">MSI firmware 041</text>
<text x="454" y="270" font-size="26" font-weight="400" fill="#f4efe7">Scaler policy, timers and</text>
<text x="454" y="304" font-size="26" font-weight="400" fill="#f4efe7">53 fixed panel accesses</text>
<text x="454" y="354" font-size="22" font-weight="400" fill="#a7a29a">Live identity and OLED Care state</text>
<text x="966" y="270" font-size="26" font-weight="400" fill="#f4efe7">Panel executable</text>
<text x="966" y="350" font-size="22" font-weight="400" fill="#a7a29a">No arbitrary memory-read</text>
<text x="966" y="379" font-size="22" font-weight="400" fill="#a7a29a">command</text>
<line x1="64" y1="410" x2="1336" y2="410" stroke="#343238" stroke-width="1"/>
<text x="64" y="452" font-size="22" font-weight="500" fill="#e8a13a">Related source</text>
<text x="64" y="496" font-size="30" font-weight="500" fill="#f4efe7">Samsung PontusM</text>
<text x="454" y="452" font-size="26" font-weight="400" fill="#f4efe7">QD maps, classifiers and</text>
<text x="454" y="486" font-size="26" font-weight="400" fill="#f4efe7">published shift orbits</text>
<text x="454" y="536" font-size="22" font-weight="400" fill="#a7a29a">Source from 2022 through 2024</text>
<text x="966" y="452" font-size="26" font-weight="400" fill="#f4efe7">Exact MSI reuse</text>
<text x="966" y="532" font-size="22" font-weight="400" fill="#a7a29a">Related code is not</text>
<text x="966" y="561" font-size="22" font-weight="400" fill="#a7a29a">the target binary</text>
<line x1="64" y1="592" x2="1336" y2="592" stroke="#343238" stroke-width="1"/>
<text x="64" y="634" font-size="22" font-weight="500" fill="#72e0b5">Observed target</text>
<text x="64" y="678" font-size="30" font-weight="500" fill="#f4efe7">Camera trace</text>
<text x="454" y="634" font-size="26" font-weight="400" fill="#f4efe7">43 positions on an exact</text>
<text x="454" y="668" font-size="26" font-weight="400" fill="#f4efe7">one-pixel lattice</text>
<text x="454" y="718" font-size="22" font-weight="400" fill="#a7a29a">Mean interval: 60.134 s in Fast mode</text>
<text x="966" y="634" font-size="26" font-weight="400" fill="#f4efe7">The code that</text>
<text x="966" y="670" font-size="26" font-weight="400" fill="#f4efe7">produced the trace</text>
<text x="966" y="714" font-size="22" font-weight="400" fill="#a7a29a">Behavior does not reveal</text>
<text x="966" y="743" font-size="22" font-weight="400" fill="#a7a29a">implementation</text>
<line x1="64" y1="774" x2="1336" y2="774" stroke="#343238" stroke-width="1"/>
<text x="64" y="826" font-size="23" font-weight="500" fill="#ff9a90">Still unavailable</text>
<text x="294" y="826" font-size="23" font-weight="400" fill="#a7a29a">Panel executable, OFF / EL equations and the 2024 SRP generator</text>
</g>
</svg>
