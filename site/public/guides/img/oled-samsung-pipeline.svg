<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 872" width="1400" height="872" role="img" aria-label="Hardware summaries feed a nominal 20 ms software worker, which writes a 15 by 15 duty map in five phases of 45 cells. The grid is schematic.">
<rect x="0" y="0" width="1400" height="872" fill="#09090b"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<text x="64" y="72" font-size="38" font-weight="500" fill="#f4efe7">The worker never receives the full image</text>
<text x="64" y="114" font-size="23" font-weight="400" fill="#a7a29a">Hardware supplies image summaries. Software combines them with temporal state.</text>
<line x1="64" y1="148" x2="1336" y2="148" stroke="#343238" stroke-width="1"/>
<text x="64" y="208" font-size="26" font-weight="500" fill="#e8a13a">Hardware input</text>
<text x="506" y="208" font-size="26" font-weight="500" fill="#f4efe7">Software · 20 ms tick</text>
<text x="968" y="208" font-size="26" font-weight="500" fill="#e8a13a">Regional output</text>
<line x1="466" y1="186" x2="466" y2="624" stroke="#343238" stroke-width="1"/>
<line x1="922" y1="186" x2="922" y2="624" stroke="#343238" stroke-width="1"/>
<text x="64" y="272" font-size="28" font-weight="500" fill="#f4efe7">Spatial statistics</text>
<text x="64" y="312" font-size="23" font-weight="400" fill="#a7a29a">Row and column means,</text>
<text x="64" y="344" font-size="23" font-weight="400" fill="#a7a29a">maxima and histogram</text>
<text x="64" y="414" font-size="28" font-weight="500" fill="#f4efe7">Scene state</text>
<text x="64" y="454" font-size="23" font-weight="400" fill="#a7a29a">Motion, hue, picture mode</text>
<text x="64" y="486" font-size="23" font-weight="400" fill="#a7a29a">and on-screen display area</text>
<text x="64" y="556" font-size="28" font-weight="500" fill="#f4efe7">Candidate gains</text>
<text x="64" y="596" font-size="23" font-weight="400" fill="#a7a29a">225 regional values</text>
<text x="64" y="628" font-size="23" font-weight="400" fill="#a7a29a">supplied by hardware</text>
<text x="506" y="284" font-size="26" font-weight="400" fill="#f4efe7">Counters and classifiers</text>
<text x="506" y="346" font-size="26" font-weight="400" fill="#f4efe7">Attack and release</text>
<text x="506" y="408" font-size="26" font-weight="400" fill="#f4efe7">Fixed-point limits</text>
<text x="506" y="470" font-size="26" font-weight="400" fill="#f4efe7">App and pattern gates</text>
<line x1="506" y1="522" x2="876" y2="522" stroke="#343238" stroke-width="1"/>
<text x="506" y="564" font-size="23" font-weight="400" fill="#a7a29a">State is carried forward</text>
<text x="506" y="597" font-size="23" font-weight="400" fill="#a7a29a">to the next call.</text>
