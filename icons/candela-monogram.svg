<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181F"/>
      <stop offset="1" stop-color="#090A0E"/>
    </linearGradient>
    <linearGradient id="c6" x1="0.6" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#8A6224"/>
      <stop offset="0.45" stop-color="#E89B2E"/>
      <stop offset="0.85" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#FFF2CE"/>
    </linearGradient>
    <radialGradient id="tip6" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFBEE" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFD26A" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFD26A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle6">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle6)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg6)"/>

    <!-- C drawn as a trail of light, brightening toward its tip -->
    <path d="M 685.6 718.8 A 270 270 0 1 1 685.6 305.2"
          fill="none" stroke="url(#c6)" stroke-width="126" stroke-linecap="round"/>

    <!-- glowing tip -->
    <circle cx="685.6" cy="305.2" r="165" fill="url(#tip6)"/>
    <circle cx="685.6" cy="305.2" r="56" fill="#FFFDF4"/>
  </g>
</svg>
