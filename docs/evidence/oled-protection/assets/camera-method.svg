<text x="64" y="735" font-size="27" font-weight="400" fill="#e8a13a">Display motion</text>
<text x="289" y="735" font-size="27" font-weight="400" fill="#a7a29a">−</text>
<text x="334" y="735" font-size="27" font-weight="400" fill="#72e0b5">Reference motion</text>
