<rect x="1262" y="246" width="40" height="264" fill="none" stroke="#72e0b5"/>
<text x="552" y="274" font-size="26" font-weight="400" fill="#f4efe7">Active image</text>
<text x="952" y="342" font-size="24" font-weight="400" fill="#e8a13a">Display tracking region</text>
<line x1="1074" y1="355" x2="1074" y2="392" stroke="#e8a13a" stroke-width="1"/>
