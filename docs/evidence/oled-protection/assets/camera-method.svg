<text x="64" y="114" font-size="23" font-weight="400" fill="#a7a29a">Track the active image and a stationary physical reference in the same clip.</text>
<line x1="64" y1="148" x2="1336" y2="148" stroke="#343238" stroke-width="1"/>
<rect x="64" y="208" width="246" height="370" fill="#101014" stroke="#56535a"/>
