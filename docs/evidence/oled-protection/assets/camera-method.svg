<line x1="1269" y1="336" x2="1294" y2="336" stroke="#65615c" stroke-width="3"/>
<line x1="1269" y1="378" x2="1294" y2="378" stroke="#65615c" stroke-width="3"/>
<line x1="1269" y1="420" x2="1294" y2="420" stroke="#65615c" stroke-width="3"/>
<line x1="1269" y1="462" x2="1294" y2="462" stroke="#65615c" stroke-width="3"/>
<line x1="1269" y1="504" x2="1294" y2="504" stroke="#65615c" stroke-width="3"/>
