<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-label="A camera tracks display motion and a stationary bezel reference independently. Subtract reference motion and apply same-clip calibration to measure panel shift in source pixels.">
